
<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="./css/b5.css">
    <link rel="stylesheet" href="./css/main.css">
</head>

<body>

    <div class="container mt-5">

        <div class="row justify-content-center">

            <div class="col-12 text-center mb-4">
                <h1>Triplos y Cuádruplos</h1>
                <hr>
            </div>

            <div class="col-12 col-md-8 mb-3">

                <label for="expresion" class="form-label">
                    Ingrese una expresion matematica
                </label>

                <input
                    type="text"
                    class="form-control"
                    id="expresion"
                    placeholder="Ejemplo: r = a + (b - c) * d"
                >

            </div>

            <div class="col-12 text-center mb-4">

                <button
                    type="button"
                    class="btn btn-primary"
                    id="btnGenerar"
                >
                    Generar tablas
                </button>

                <button
                    type="button"
                    class="btn btn-secondary"
                    id="btnLimpiar"
                >
                    Limpiar
                </button>

            </div>

            <div class="col-12 mb-3">
                <div id="mensaje" class="text-center"></div>
            </div>

            <div class="col-12 mb-5">

                <h3 class="text-center mb-3">Tabla de Triplos</h3>

                <div class="table-responsive">

                    <table class="table table-bordered table-striped text-center">

                        <thead class="table-dark">
                            <tr>
                                <th>Numero</th>
                                <th>Operador</th>
                                <th>Argumento 1</th>
                                <th>Argumento 2</th>
                            </tr>
                        </thead>

                        <tbody id="tablaTriplos">
                            <tr>
                                <td colspan="4">
                                    Ingresa una expresion para generar los triplos.
                                </td>
                            </tr>
                        </tbody>

                    </table>

                </div>

            </div>

            <div class="col-12 mb-5">

                <h3 class="text-center mb-3">Tabla de Cuádruplos</h3>

                <div class="table-responsive">

                    <table class="table table-bordered table-striped text-center">

                        <thead class="table-dark">
                            <tr>
                                <th>Numero</th>
                                <th>Operador</th>
                                <th>Argumento 1</th>
                                <th>Argumento 2</th>
                                <th>Resultado</th>
                            </tr>
                        </thead>

                        <tbody id="tablaCuadruplos">
                            <tr>
                                <td colspan="5">
                                    Ingresa una expresion para generar los cuadruplos.
                                </td>
                            </tr>
                        </tbody>

                    </table>

                </div>

            </div>

        </div>

    </div>

    <script src="./js/index.js"></script>

</body>
</html>
